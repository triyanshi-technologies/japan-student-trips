<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>.sn-burger{display:none}@media (max-width:860px){.sn-bar{padding:10px 16px!important;gap:12px!important}.sn-burger{display:flex!important}.sn-nav{display:flex!important;position:absolute;top:100%;left:0;right:0;width:auto;background:#F7F5EF;padding:0 16px;box-shadow:0 14px 24px rgba(23,43,58,0.12);border-bottom:1px solid rgba(23,43,58,0.10);flex-direction:column!important;align-items:stretch!important;flex-wrap:nowrap!important;gap:4px!important;overflow:hidden;max-height:0;opacity:0;visibility:hidden;transform:translateY(-6px);transition:max-height 300ms ease,opacity 220ms ease,transform 300ms ease,visibility 0s linear 300ms}.sn-nav.sn-open{max-height:480px;opacity:1;visibility:visible;transform:none;padding:8px 16px 14px;transition:max-height 300ms ease,opacity 220ms ease 40ms,transform 300ms ease,visibility 0s}@media (prefers-reduced-motion:reduce){.sn-nav,.sn-nav.sn-open{transition:none!important}}.sn-nav a{padding:14px 12px!important;font-size:16px!important;border-radius:10px!important}.sn-nav a.sn-cta{margin:6px 0 0!important;text-align:center}}</style></helmet>
<header style="position:sticky;top:0;z-index:50;background:rgba(247,245,239,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(23,43,58,0.10);font-family:Inter,system-ui,sans-serif">
  <div class="sn-bar" style="max-width:1240px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
    <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#172B3A">
      <span style="width:34px;height:34px;border-radius:50%;background:#D84A3A;display:flex;align-items:center;justify-content:center;position:relative;flex:none">
        <span style="width:12px;height:12px;border-radius:50%;background:#F7F5EF"></span>
      </span>
      <span style="display:flex;flex-direction:column;line-height:1.05">
        <span style="font:800 18px/1.1 Manrope,sans-serif;letter-spacing:-0.02em">Waindo Connect</span>
        <span style="font:500 11px/1.3 Inter,sans-serif;color:#4A5A66;letter-spacing:0.04em">Japan study trips · from India</span>
      </span>
    </a>
    <button class="sn-burger" onClick="{{ toggle }}" aria-label="Menu" aria-expanded="{{ expanded }}" style="width:44px;height:44px;border-radius:10px;border:1.5px solid rgba(23,43,58,0.18);background:#fff;cursor:pointer;align-items:center;justify-content:center;flex:none;padding:0;color:#172B3A">
      <sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></sc-if>
      <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></sc-if>
    </button>
    <nav class="{{ navCls }}" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <sc-if value="{{ l.active }}" hint-placeholder-val="{{ false }}">
          <a href="{{ l.href }}" style="padding:8px 12px;border-radius:999px;background:#172B3A;color:#F7F5EF;font:600 14px/1 Inter,sans-serif;text-decoration:none">{{ l.label }}</a>
        </sc-if>
        <sc-if value="{{ l.inactive }}" hint-placeholder-val="{{ true }}">
          <a href="{{ l.href }}" style="padding:8px 12px;border-radius:999px;color:#172B3A;font:500 14px/1 Inter,sans-serif;text-decoration:none;transition:background 200ms ease-out" style-hover="background:rgba(23,43,58,0.07)">{{ l.label }}</a>
        </sc-if>
      </sc-for>
      <a class="sn-cta" href="Plan%20a%20Trip.dc.html" style="margin-left:10px;padding:11px 18px;border-radius:10px;background:#D84A3A;color:#fff;font:700 14px/1 Inter,sans-serif;text-decoration:none;transition:background 200ms ease-out" style-hover="background:#BF3B2C">Plan a Trip</a>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;japan&quot;,&quot;programs&quot;,&quot;itineraries&quot;,&quot;safety&quot;,&quot;plan&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const a = this.props.active ?? '';
    const links = [
      ['japan', 'Japan Trips', 'Japan%20Trips.dc.html'],
      ['programs', 'Programs', 'Programs.dc.html'],
      ['itineraries', 'Sample Itineraries', 'Sample%20Itineraries.dc.html'],
      ['safety', 'Safety & Planning', 'Safety%20and%20Planning.dc.html'],
    ].map(([k, label, href]) => ({ label, href, active: k === a, inactive: k !== a }));
    const open = this.state.open;
    return { links, open, closed: !open, expanded: open ? 'true' : 'false', navCls: open ? 'sn-nav sn-open' : 'sn-nav', toggle: () => this.setState({ open: !open }) };
  }
}
</script>
</body>
</html>
